<section id="login">
  <form class="glass-box" id="loginForm">
    <div class="g-head">
      <span class="logo"><svg class="ic"><use href="#i-box"/></svg></span>
      <span class="g-brand appname">Order Desk</span>
    </div>
    <h2>Welcome back</h2>
    <p class="sub">Sign in to manage your store.</p>
    <label for="em">Email</label>
    <div class="withic"><svg class="ic"><use href="#i-mail"/></svg><input class="field" id="em" type="email" autocomplete="username" placeholder="you@example.com" required></div>
    <label for="pw">Password</label>
    <div class="withic"><svg class="ic"><use href="#i-lock"/></svg><input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Your password" required><button class="pwtoggle" id="pwToggle" type="button" aria-label="Show password"><svg class="ic"><use href="#i-eye"/></svg></button></div>
    <button class="btn" type="submit">Sign in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>
